<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumo Financeiro</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            padding: 20px;
        }

        .container-financeiro {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            max-width: 1200px;
            margin: 0 auto;
        }

        .card-financeiro {
            background: white;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            min-width: 250px;
            border-left: 5px solid #007bff;
        }

        .card-financeiro.receita {
            border-left-color: #28a745;
        }

        .card-financeiro.despesa {
            border-left-color: #dc3545;
        }

        .card-financeiro h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-financeiro .valor {
            font-size: 28px;
            font-weight: bold;
            color: #007bff;
        }

        .card-financeiro.receita .valor {
            color: #28a745;
        }

        .card-financeiro.despesa .valor {
            color: #dc3545;
        }

        .card-financeiro p {
            font-size: 12px;
            color: #999;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container-financeiro">
        <div class="card-financeiro receita">
            <h3>Receita Total</h3>
            <div class="valor">R$ 5.500,00</div>
            <p>Mês de Agosto</p>
        </div>

        <div class="card-financeiro despesa">
            <h3>Despesa Total</h3>
            <div class="valor">R$ 2.300,00</div>
            <p>Mês de Agosto</p>
        </div>

        <div class="card-financeiro">
            <h3>Saldo</h3>
            <div class="valor">R$ 3.200,00</div>
            <p>Situação Positiva</p>
        </div>
    </div>
</body>
</html>
